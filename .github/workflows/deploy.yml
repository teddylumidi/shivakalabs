name: Deploy to GitHub Pages

# The live site is currently published from the /docs folder on main
# (Settings -> Pages -> "Deploy from a branch: main /docs"); update it with
# `pnpm run publish`. This workflow is the alternative: to use it, set
# Settings -> Pages -> Source to "GitHub Actions", then add back:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shivakalabs
        working-directory: artifacts/shivakalabs
        env:
          PORT: 3000
          BASE_PATH: /shivakalabs/
          NODE_ENV: production
          # Public site URL (no trailing slash) for canonical links and the
          # sitemap. Change this if you move the site to a custom domain.
          VITE_SITE_URL: https://teddylumidi.github.io/shivakalabs
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/shivakalabs/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
